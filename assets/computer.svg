<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="340" height="260" shape-rendering="crispEdges">
  <style>
    .lgray { fill: #d6d2c8; }
    .dgray { fill: #55524e; }
    .gray  { fill: #9b9484; }
    .screen{ fill: #2b293e; }
    .px    { fill: #35b7da; }

    #f1 { animation: f1 3500ms linear infinite alternate; }
    #f2 { animation: f2 3500ms linear infinite alternate; }
    #f3 { animation: f3 3500ms linear infinite alternate; }
    #f4 { animation: f4 3500ms linear infinite alternate; }
    #f5 { animation: f5 3500ms linear infinite alternate; }

    @keyframes f1 { 0%,18%{opacity:1} 22%,100%{opacity:0} }
    @keyframes f2 { 0%,20%{opacity:0} 24%,38%{opacity:1} 42%,100%{opacity:0} }
    @keyframes f3 { 0%,42%{opacity:0} 44%,58%{opacity:1} 62%,100%{opacity:0} }
    @keyframes f4 { 0%,62%{opacity:0} 64%,78%{opacity:1} 82%,100%{opacity:0} }
    @keyframes f5 { 0%,82%{opacity:0} 84%,100%{opacity:1} }
  </style>

  <!-- Keyboard -->
  <rect class="dgray" x="86" y="222" width="228" height="28"/>
  <rect class="lgray" x="90" y="224" width="220" height="20"/>
  <g class="gray">
    <rect x="98"  y="228" width="14" height="5"/>
    <rect x="118" y="228" width="14" height="5"/>
    <rect x="138" y="228" width="14" height="5"/>
    <rect x="158" y="228" width="14" height="5"/>
    <rect x="178" y="228" width="14" height="5"/>
    <rect x="198" y="228" width="14" height="5"/>
    <rect x="218" y="228" width="14" height="5"/>
    <rect x="238" y="228" width="14" height="5"/>
    <rect x="258" y="228" width="14" height="5"/>
    <rect x="278" y="228" width="14" height="5"/>
    <rect x="128" y="236" width="144" height="5"/>
  </g>

  <!-- Stand + base -->
  <rect class="dgray" x="182" y="190" width="36" height="22"/>
  <rect class="gray"  x="150" y="210" width="100" height="12"/>

  <!-- Monitor body -->
  <rect class="dgray" x="96"  y="26" width="208" height="168"/>
  <rect class="gray"  x="100" y="30" width="200" height="160"/>
  <rect class="lgray" x="106" y="36" width="188" height="148"/>

  <!-- Screen -->
  <rect class="screen" x="120" y="50" width="160" height="120"/>

  <!-- Typing "Hi" animation frames (10px pixels) -->
  <g class="px">
    <g id="f1">
      <rect x="170" y="120" width="10" height="10"/>
      <rect x="210" y="90"  width="10" height="10"/>
      <rect x="210" y="100" width="10" height="10"/>
      <rect x="180" y="90"  width="10" height="10"/>
      <rect x="180" y="100" width="10" height="10"/>
      <rect x="220" y="120" width="10" height="10"/>
      <rect x="210" y="130" width="10" height="10"/>
      <rect x="200" y="130" width="10" height="10"/>
      <rect x="190" y="130" width="10" height="10"/>
      <rect x="180" y="130" width="10" height="10"/>
    </g>
    <g id="f2">
      <rect x="170" y="120" width="10" height="10"/>
      <rect x="220" y="90"  width="10" height="10"/>
      <rect x="210" y="100" width="10" height="10"/>
      <rect x="170" y="90"  width="10" height="10"/>
      <rect x="180" y="100" width="10" height="10"/>
      <rect x="220" y="120" width="10" height="10"/>
      <rect x="210" y="130" width="10" height="10"/>
      <rect x="200" y="120" width="10" height="10"/>
      <rect x="190" y="130" width="10" height="10"/>
      <rect x="180" y="130" width="10" height="10"/>
    </g>
    <g id="f3">
      <rect x="170" y="120" width="10" height="10"/>
      <rect x="220" y="90"  width="10" height="10"/>
      <rect x="220" y="120" width="10" height="10"/>
      <rect x="210" y="130" width="10" height="10"/>
      <rect x="200" y="100" width="10" height="10"/>
      <rect x="200" y="120" width="10" height="10"/>
      <rect x="200" y="130" width="10" height="10"/>
      <rect x="180" y="110" width="10" height="10"/>
      <rect x="170" y="90"  width="10" height="10"/>
      <rect x="170" y="100" width="10" height="10"/>
      <rect x="170" y="130" width="10" height="10"/>
    </g>
    <g id="f4">
      <rect x="170" y="120" width="10" height="10"/>
      <rect x="220" y="90"  width="10" height="10"/>
      <rect x="220" y="120" width="10" height="10"/>
      <rect x="220" y="130" width="10" height="10"/>
      <rect x="200" y="90"  width="10" height="10"/>
      <rect x="200" y="100" width="10" height="10"/>
      <rect x="200" y="120" width="10" height="10"/>
      <rect x="200" y="130" width="10" height="10"/>
      <rect x="180" y="110" width="10" height="10"/>
      <rect x="170" y="90"  width="10" height="10"/>
      <rect x="170" y="100" width="10" height="10"/>
      <rect x="170" y="130" width="10" height="10"/>
    </g>
    <g id="f5">
      <rect x="170" y="120" width="10" height="10"/>
      <rect x="220" y="90"  width="10" height="10"/>
      <rect x="220" y="110" width="10" height="10"/>
      <rect x="220" y="120" width="10" height="10"/>
      <rect x="220" y="130" width="10" height="10"/>
      <rect x="200" y="90"  width="10" height="10"/>
      <rect x="200" y="100" width="10" height="10"/>
      <rect x="200" y="110" width="10" height="10"/>
      <rect x="200" y="120" width="10" height="10"/>
      <rect x="200" y="130" width="10" height="10"/>
      <rect x="190" y="110" width="10" height="10"/>
      <rect x="180" y="110" width="10" height="10"/>
      <rect x="170" y="90"  width="10" height="10"/>
      <rect x="170" y="100" width="10" height="10"/>
      <rect x="170" y="110" width="10" height="10"/>
      <rect x="170" y="130" width="10" height="10"/>
    </g>
  </g>
</svg>
